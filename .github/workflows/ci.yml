name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Used by "Update screenshots": pushes made with the workflow token don't
  # trigger workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Visual, accessibility and browser tests. Runs in the same Playwright image
  # the snapshots were made in; keep its version in sync with package.json.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:visual
        env:
          HOME: /root
      # axe-core over the same page and states: WCAG 2.2 A / AA and best practice
      - run: npm run test:a11y
        if: success() || failure()
        env:
          HOME: /root
      # The components in a real browser: dialog focus, dragging, the clipboard
      - run: npm run test:browser
        if: success() || failure()
        env:
          HOME: /root
      - name: Upload the expected, actual and diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 14
