# Tags a release when package.json's version changes on main.
#
# Bump "version" in package.json and add its section to CHANGELOG.md in the
# same pull request. When that merges, this tags the commit vX.Y.Z and makes
# a GitHub release from the changelog section.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already released"
            exit 0
          fi
          # The changelog section for this version: from its heading to the next
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file notes.md
