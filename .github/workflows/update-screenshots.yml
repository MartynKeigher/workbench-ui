# Regenerates the visual tests' images (visual/*-snapshots/) and the README's
# docs/screenshot-*.png on a branch, in the same Playwright image CI uses, and
# commits any that changed to that branch.
#
# Use it when a pull request changes how something looks on purpose: Actions →
# Update screenshots → Run workflow → pick the pull request's branch. Then
# check the new images in the pull request's diff.
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-screenshots-${{ github.ref }}

jobs:
  update:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate in the Playwright image
        # Keep its version equal to @playwright/test in package.json
        run: |
          docker run --rm -e CI=1 -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash -c 'npm ci && npm run test:visual:update && npm run screenshots'
      - name: Commit changed images
        id: commit
        run: |
          git add visual docs
          if git diff --cached --quiet; then
            echo "No images changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update screenshots'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Run CI on the new commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
